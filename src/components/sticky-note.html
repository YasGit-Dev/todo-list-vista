<template id="sticky-note-template">
  <div class="bg-brand-beige rounded-xl p-4 flex flex-col gap-2">
    <div class="flex justify-between items-start">
      <p class="font-jost text-brand-bg text-base" data-field="title"></p>
      <i class="ti ti-circle-check text-brand-gray text-lg cursor-pointer"></i>
    </div>
    <p class="font-actor text-brand-gray text-sm" data-field="detail"></p>
    <div class="flex justify-between items-center mt-1">
      <p class="font-actor text-brand-gray text-xs">Start date : <span class="font-inter" data-field="date"></span></p>
      <div class="flex gap-2">
        <i class="ti ti-edit text-brand-gray text-base cursor-pointer"></i>
        <i class="ti ti-trash text-brand-gray text-base cursor-pointer"></i>
      </div>
    </div>
  </div>
</template>
